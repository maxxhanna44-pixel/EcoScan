<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoScan - Gemini AI Vision</title>
    
    <style>
        :root {
            --primary-green: #38b000;
            --light-green: #70e000;
            --dark-bg: #121619;
            --card-bg: #1e242b;
            --text-light: #f8f9fa;
            --text-muted: #a0aec0;
            
            /* Bin Colors */
            --bin-recycle: #0077b6;
            --bin-compost: #2b9348;
            --bin-landfill: #e63946;
            --bin-special: #ffb703;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .logo-svg-container {
            width: 100%;
            max-width: 360px;
            filter: drop-shadow(0 0 15px rgba(56, 176, 0, 0.25));
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .app-container {
                grid-template-columns: 1.1fr 0.9fr;
            }
        }

        .scanner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #2a323d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .camera-viewport {
            width: 100%;
            height: 320px;
            background-color: #000;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-overlay {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-overlay .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--primary-green);
            border-style: solid;
        }

        .corner.tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 8px; }
        .corner.tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 8px; }
        .corner.bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 8px; }
        .corner.br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 8px; }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--light-green), transparent);
            top: 0;
            box-shadow: 0 0 10px var(--light-green);
            animation: scanAnimation 2s infinite ease-in-out;
            display: none;
        }

        @keyframes scanAnimation {
            0% { top: 0%; opacity: 0.2; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.2; }
        }

        .controls {
            margin-top: 16px;
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-green), #2b9348);
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 176, 0, 0.3);
        }

        .btn-secondary {
            background-color: #2a323d;
            color: var(--text-light);
        }

        .bins-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a323d;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(56, 176, 0, 0.1);
            color: var(--light-green);
            border: 1px solid rgba(56, 176, 0, 0.3);
        }

        .bins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            flex: 1;
        }

        .bin-item {
            background: #161b22;
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bin-item.active {
            border-color: var(--active-color, var(--primary-green));
            background: rgba(255,255,255,0.03);
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .bin-illustration {
            width: 76px;
            height: 96px;
            position: relative;
            margin-bottom: 12px;
        }

        .bin-mouth {
            width: 62px;
            height: 16px;
            position: absolute;
            top: 17px;
            left: 7px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, #05070a 0%, #1a1f26 75%);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.7);
            z-index: 1;
        }

        .bin-lid {
            width: 82px;
            height: 16px;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: -3px;
            z-index: 2;
            background-color: var(--bin-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                        height 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                        top 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                        left 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .bin-lid-handle {
            width: 22px;
            height: 4px;
            background: rgba(255,255,255,0.5);
            border-radius: 2px;
            transition: opacity 0.2s;
        }

        .bin-item.active .bin-lid {
            width: 56px;
            height: 56px;
            top: -30px;
            left: 10px;
        }

        .bin-item.active .bin-lid-handle {
            opacity: 0;
        }

        .bin-body {
            width: 68px;
            height: 76px;
            background: var(--bin-color);
            position: absolute;
            bottom: 0;
            left: 4px;
            border-radius: 3px 3px 10px 10px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            box-shadow: inset -6px 0 10px rgba(0,0,0,0.25);
            clip-path: polygon(2% 0, 98% 0, 94% 100%, 6% 100%);
        }

        .bin-icon {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.85);
        }

        .bin-name {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .bin-type {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }

        .result-panel {
            margin-top: 16px;
            background: #161b22;
            border-radius: 12px;
            padding: 14px;
            border-left: 4px solid var(--primary-green);
            display: none;
        }

        .result-panel.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
        }

        .result-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-svg-container">
            <svg viewBox="0 0 500 215" width="100%" height="100%">
                <defs>
                    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#70e000" />
                        <stop offset="100%" stop-color="#38b000" />
                    </linearGradient>
                    <linearGradient id="cameraBg" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#2a323d" />
                        <stop offset="100%" stop-color="#0e1217" />
                    </linearGradient>
                </defs>
                <path d="M 205 35 A 65 65 0 1 0 295 105" fill="none" stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round"/>
                <path d="M 300 90 Q 320 60 330 40 Q 315 75 300 90 Z" fill="#38b000"/>
                <path d="M 312 75 Q 320 65 330 40" fill="none" stroke="#70e000" stroke-width="2" stroke-linecap="round"/>
                <g transform="translate(215, 20)">
                    <rect x="15" y="5" width="70" height="95" rx="20" fill="url(#cameraBg)" stroke="#3a4454" stroke-width="2"/>
                    <rect x="42" y="12" width="16" height="4" rx="2" fill="#70e000"/>
                    <circle cx="50" cy="34" r="14" fill="#0b0e11" stroke="#1f262e" stroke-width="3"/>
                    <circle cx="50" cy="34" r="6" fill="#15222e"/>
                    <circle cx="47" cy="31" r="2" fill="#ffffff" opacity="0.6"/>
                    <rect x="25" y="54" width="50" height="36" rx="6" fill="#06090c"/>
                    <text x="50" y="78" font-size="18" text-anchor="middle" fill="#38b000">♻</text>
                </g>
                <g transform="translate(100, 155)">
                    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="42" fill="url(#greenGrad)">Eco</text>
                    <text x="75" y="0" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="42" fill="#ffffff">Scan</text>
                </g>
            </svg>
        </div>
    </header>

    <div class="app-container">
        <div class="scanner-card">
            <div class="camera-viewport">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="snapshotCanvas" style="display:none;"></canvas>
                <div class="scanner-overlay" id="reticle">
                    <div class="corner tl"></div>
                    <div class="corner tr"></div>
                    <div class="corner bl"></div>
                    <div class="corner br"></div>
                    <div class="scan-line" id="scanLine"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="scanBtn">
                    📷 Scan Item
                </button>
                <button class="btn btn-secondary" id="toggleCamBtn">
                    🔄 Flip Camera
                </button>
            </div>
        </div>

        <div class="bins-card">
            <div class="card-title">
                <span>Sorting Destination</span>
                <span class="status-badge" id="statusBadge">Ready</span>
            </div>

            <div class="bins-grid">
                <div class="bin-item" id="bin-recycle" style="--bin-color: var(--bin-recycle); --active-color: var(--bin-recycle);">
                    <div class="bin-illustration">
                        <div class="bin-mouth"></div>
                        <div class="bin-lid"><div class="bin-lid-handle"></div></div>
                        <div class="bin-body"><span class="bin-icon">♻️</span></div>
                    </div>
                    <div class="bin-name">Recycling</div>
                    <div class="bin-type">Plastics, Glass, Paper</div>
                </div>

                <div class="bin-item" id="bin-compost" style="--bin-color: var(--bin-compost); --active-color: var(--bin-compost);">
                    <div class="bin-illustration">
                        <div class="bin-mouth"></div>
                        <div class="bin-lid"><div class="bin-lid-handle"></div></div>
                        <div class="bin-body"><span class="bin-icon">🌱</span></div>
                    </div>
                    <div class="bin-name">Compost</div>
                    <div class="bin-type">Food Scraps</div>
                </div>

                <div class="bin-item" id="bin-landfill" style="--bin-color: var(--bin-landfill); --active-color: var(--bin-landfill);">
                    <div class="bin-illustration">
                        <div class="bin-mouth"></div>
                        <div class="bin-lid"><div class="bin-lid-handle"></div></div>
                        <div class="bin-body"><span class="bin-icon">🗑️</span></div>
                    </div>
                    <div class="bin-name">Landfill</div>
                    <div class="bin-type">General Waste</div>
                </div>

                <div class="bin-item" id="bin-special" style="--bin-color: var(--bin-special); --active-color: var(--bin-special);">
                    <div class="bin-illustration">
                        <div class="bin-mouth"></div>
                        <div class="bin-lid"><div class="bin-lid-handle"></div></div>
                        <div class="bin-body"><span class="bin-icon">⚡</span></div>
                    </div>
                    <div class="bin-name">Special / Drop-off</div>
                    <div class="bin-type">E-Waste, Soft Plastics</div>
                </div>
            </div>

            <div class="result-panel" id="resultPanel">
                <div class="result-title"><span id="detectedItem">-</span></div>
                <div class="result-desc" id="instructionText">-</div>
            </div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // PASTE YOUR GEMINI API KEY HERE:
        // ----------------------------------------------------
        const WORKER_URL = "https://ecoscan-api.maxxhanna44.workers.dev/";
        // ----------------------------------------------------

        const video = document.getElementById('webcam');
        const snapshotCanvas = document.getElementById('snapshotCanvas');
        const ctx = snapshotCanvas.getContext('2d');
        const scanBtn = document.getElementById('scanBtn');
        const scanLine = document.getElementById('scanLine');
        const statusBadge = document.getElementById('statusBadge');
        const resultPanel = document.getElementById('resultPanel');
        const detectedItemLabel = document.getElementById('detectedItem');
        const instructionText = document.getElementById('instructionText');

        let currentStream = null;
        let facingMode = 'environment';

        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode }
                });
                video.srcObject = stream;
                currentStream = stream;
            } catch (err) {
                console.warn('Camera error:', err);
                statusBadge.textContent = 'Camera Unavailable';
            }
        }

        document.getElementById('toggleCamBtn').addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        scanBtn.addEventListener('click', async () => {
            startScanEffect();

            try {
                snapshotCanvas.width = video.videoWidth;
                snapshotCanvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);
                
                const base64Image = snapshotCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];

                const prompt = `You are EcoScan, a waste sorting API. 
                Identify the primary object in the image and tell the user how to dispose of it.
                You must reply ONLY with a raw JSON object. Do not include markdown code block syntax like \`\`\`json.
                Required JSON structure:
                {
                  "item": "Specific name of the object (e.g. Cardboard Box, Scissors, Apple Core)",
                  "bin": "recycle" OR "compost" OR "landfill" OR "special",
                  "instruction": "One sentence explaining exactly what to do with it."
                }`;

                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        image: base64Image
                    })
                });

                if (!response.ok) {
                    const errorJson = await response.json().catch(() => ({}));
                    throw new Error(errorJson.error?.message || 'Gemini API request failed');
                }

                const data = await response.json();
                let aiResultString = data.choices[0].message.content;
                aiResultString = aiResultString.replace(/```json/gi, '').replace(/```/g, '').trim();
                const aiResult = JSON.parse(aiResultString);

                displayResult(aiResult.item, aiResult.bin, aiResult.instruction);

            } catch (error) {
                console.error("Scan Error:", error);
                scanLine.style.display = 'none';
                statusBadge.textContent = 'Scan Failed';
                statusBadge.style.color = '#e63946';
                alert(error.message);
            }
        });

        function startScanEffect() {
            scanLine.style.display = 'block';
            statusBadge.textContent = 'Analyzing...';
            statusBadge.style.color = 'var(--primary-green)';
            document.querySelectorAll('.bin-item').forEach(bin => bin.classList.remove('active'));
            resultPanel.classList.remove('show');
        }

        function speakResult(itemName, binCategory, instruction) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const binLabel = {
                recycle: 'the recycling bin',
                compost: 'the compost bin',
                landfill: 'the landfill bin',
                special: 'special drop-off'
            }[binCategory] || 'the landfill bin';
            const utterance = new SpeechSynthesisUtterance(
                `${itemName}. This goes in ${binLabel}. ${instruction}`
            );
            utterance.rate = 1;
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }

        function displayResult(itemName, binCategory, instruction) {
            scanLine.style.display = 'none';
            statusBadge.textContent = 'Object Identified';

            const validBins = ['recycle', 'compost', 'landfill', 'special'];
            const targetBinId = validBins.includes(binCategory) ? binCategory : 'landfill';

            const targetBin = document.getElementById(`bin-${targetBinId}`);
            if (targetBin) {
                targetBin.classList.add('active');
            }

            detectedItemLabel.textContent = itemName;
            instructionText.innerHTML = instruction;

            const binColor = getComputedStyle(targetBin).getPropertyValue('--bin-color');
            resultPanel.style.borderLeftColor = binColor;
            resultPanel.classList.add('show');

            speakResult(itemName, targetBinId, instruction);
        }

        initCamera();
    </script>
</body>
</html>
